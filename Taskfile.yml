# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!
  NIX_PATH: /etc/nixos/configuration.nix

tasks:
  default:
    cmds:
      - echo "NixOS Configuration Tasks"
      - task -l
    silent: true
  switch:
    desc: Switch to stable setup
    cmds:
      - git add . && nixos-rebuild switch --flake .#nixbook
  switch-test:
    desc: Switch to new setup
    cmds:
      - nixos-rebuild switch --flake .#nixbook2
  show_secrets:
    desc: "Riskyyyy"
    cmds:
      - sops -d hosts/users/conor/secrets.enc.yaml
  edit_secrets:
    desc: "Riskyyyy"
    cmds:
      - sops edit hosts/users/conor/secrets.enc.yaml
  clean:
    desc: Cleans older nixos generations
    cmds:
      - nix-collect-garbage -d
